base:
  device: "gpu"
  wandb_project_name: "IRIS-notebooks"
  wandb_entity: "entropeaks-universit-paul-sabatier-toulouse-iii"

dataset:
  original_dataset_path: "my_original_data_path"
  augmented_dataset_path: "my_augmented_data_path"

eval:
  recall_k: [1, 3, 10]
  k_query: 1
  val_size: 0.2
  test_size: 0.1

model:
  backbone_name: "facebook/dinov3-vits16-pretrain-lvd1689m"
  pooling: "gem"              # cls | gem | avg
  hidden_dim: 0
  projection_head_size: 128   # 0 drops the head entirely
  normalize: true
  dropout: 0

train:
  epochs: 10
  head_lr: 0.0005
  backbone_lr: 0.00005
  weight_decay: 0.0001
  margin: 0.3
  sampler_P: 16
  sampler_K: 8
  resize:
    height: 448
    width: 448