base:
  device: "gpu"
  wandb_project_name: "my_project_name"
  wandb_entity: "my_entity"

dataset:
  original_dataset_path: "my_original_data_path"
  augmented_dataset_path: "my_augmented_data_path"

eval:
  recall_k: [1, 3, 10]
  k_query: 1
  val_size: 0.2
  test_size: 0.1

model:
  backbone_name: "facebook/dinov3-vitb16-pretrain-lvd1689m"
  hidden_dim: 0
  output_dim: 128
  normalize: true
  dropout: 0

train:
  epochs: 20
  head_lr: 0.0005
  backbone_lr: 0.00005
  weight_decay: 0.0001
  margin: 0.3
  sampler_P: 16
  sampler_K: 8
  resize:
    height: 224
    width: 224