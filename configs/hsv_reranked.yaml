# The same channel, with colour reranking the shortlist it already produced.
name: hsv-reranked

data:
  path: /Users/timothee/Documents/programming/DIHT/data/cropped_data
  k_folds: 4
  seeds: [42, 43, 44]
  gallery_instances: 1
  n_query: 1
  resize: 224

channels:
  - extractor: hsv
    index: dense
    kernel: bhattacharyya
    weight: 1.0

reranker:
  type: hsv
  top_k_candidates: 10

smoothing_param: 10
recall_k: [1, 3, 5]
