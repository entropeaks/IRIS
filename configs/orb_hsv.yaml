# Does colour fail on different queries than local geometry does?
name: orb+hsv

data:
  path: /Users/timothee/Documents/programming/DIHT/data/cropped_data
  k_folds: 4
  seeds: [42, 43, 44]
  gallery_instances: 1
  n_query: 1
  resize: 224

channels:
  - extractor: orb
    index: sparse
    kernel: jaccard
    weighting: tfidf
    vocabulary_size: 256
    is_trainable: true
    weight: 1.0
  - extractor: hsv
    index: dense
    kernel: bhattacharyya
    weight: 1.0

smoothing_param: 10
recall_k: [1, 3, 5]
